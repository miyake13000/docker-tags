name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      BUILD_TARGET: ${{ matrix.target }}
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up musl and Rust
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$BUILD_TARGET"
      - name: Build
        run: cargo +stable build --release --locked --target "$BUILD_TARGET"
      - name: Package
        run: |
          mkdir -p dist
          gzip -n -c "target/$BUILD_TARGET/release/docker-tags" > "dist/docker-tags-linux-$RELEASE_ARCH.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum docker-tags-*.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" docker-tags-*.gz SHA256SUMS --generate-notes --title "$RELEASE_TAG"
